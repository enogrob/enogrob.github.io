<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Copilot agentic stack</title><desc id="d">A floating crystalline stack connects surfaces, runtime, tools, models, and verification.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2f9b54"/><stop offset=".5" stop-color="#42bfc0"/><stop offset="1" stop-color="#9a67d2"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".18"/></filter></defs><rect width="1600" height="900" fill="#fff"/><ellipse cx="1260" cy="-20" rx="360" ry="170" fill="#c9e9c3" opacity=".8"/><path d="M920 0q320 170 680 0M960 75q300 160 630 10M1020 145q250 130 540 35" fill="none" stroke="#72bc66" stroke-width="4" opacity=".7"/><text x="85" y="105" fill="#172554" font-family="Arial" font-size="50" font-weight="900">THE GITHUB COPILOT</text><text x="85" y="175" fill="#16803c" font-family="Arial" font-size="76" font-weight="900">AGENTIC STACK</text><text x="90" y="220" fill="#3e342c" font-family="Arial" font-size="24">Different surfaces, one shared flow of action and evidence.</text><path d="M190 360C450 220 620 500 820 350s300-120 610 80" fill="none" stroke="url(#g)" stroke-width="30" opacity=".62"/><g filter="url(#s)" font-family="Arial" text-anchor="middle"><g transform="translate(170 440) rotate(-7)"><rect x="-130" y="-50" width="260" height="100" rx="28" fill="#d9eaf7" stroke="#7aa6c2" stroke-width="5"/><text y="8" fill="#172554" font-size="25" font-weight="700">Objective</text><text y="38" fill="#6f7377" font-size="18">developer intent</text></g><g transform="translate(480 330) rotate(6)"><rect x="-150" y="-58" width="300" height="116" rx="30" fill="#e8ddf5" stroke="#a68bc4" stroke-width="5"/><text y="8" fill="#3e342c" font-size="24" font-weight="700">IDE · CLI · GitHub</text><text y="39" fill="#6f7377" font-size="18">surfaces</text></g><g transform="translate(805 500) rotate(-5)"><rect x="-180" y="-65" width="360" height="130" rx="34" fill="#f8dfc4" stroke="#c9986d" stroke-width="5"/><text y="8" fill="#3e342c" font-size="29" font-weight="700">Shared runtime</text><text y="42" fill="#6f7377" font-size="18">plan · tools · sessions</text></g><g transform="translate(1120 330) rotate(7)"><rect x="-160" y="-58" width="320" height="116" rx="30" fill="#fff1bf" stroke="#c8a84e" stroke-width="5"/><text y="8" fill="#3e342c" font-size="24" font-weight="700">Agents · Skills · MCP</text><text y="39" fill="#6f7377" font-size="18">specialized capabilities</text></g><g transform="translate(1370 520) rotate(-5)"><rect x="-145" y="-62" width="290" height="124" rx="30" fill="#f6d6dd" stroke="#c98798" stroke-width="5"/><text y="8" fill="#3e342c" font-size="24" font-weight="700">Models + HydraFusion</text><text y="40" fill="#6f7377" font-size="18">workflow selection</text></g></g><g fill="#16803c" opacity=".72"><circle cx="1060" cy="170" r="8"/><circle cx="1210" cy="230" r="5"/><circle cx="1430" cy="175" r="7"/><circle cx="1510" cy="260" r="4"/></g><path d="M520 730q100-160 200 0q100-160 200 0q100-160 200 0" fill="none" stroke="#dcefd6" stroke-width="28" opacity=".9"/><text x="90" y="815" fill="#3e342c" font-family="Arial" font-size="24" font-weight="700">Verification remains outside the agent's confidence loop.</text></svg>
