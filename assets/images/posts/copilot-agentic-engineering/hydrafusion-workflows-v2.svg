<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">HydraFusion workflows</title><desc id="d">A crystalline flowing visual shows HydraFusion choosing single, cascade, or critique workflows before verification.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2f9b54"/><stop offset=".5" stop-color="#4ebfd0"/><stop offset="1" stop-color="#a05fd5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".18"/></filter></defs><rect width="1600" height="900" fill="#fff"/><ellipse cx="1280" cy="-20" rx="350" ry="170" fill="#c9e9c3" opacity=".8"/><path d="M980 0q270 150 620 0M1000 70q300 160 600 5M1040 145q260 140 530 30" fill="none" stroke="#72bc66" stroke-width="4" opacity=".7"/><text x="85" y="105" fill="#172554" font-family="Arial" font-size="50" font-weight="900">INSIDE</text><text x="85" y="175" fill="#16803c" font-family="Arial" font-size="76" font-weight="900">HYDRAFUSION</text><text x="90" y="220" fill="#3e342c" font-family="Arial" font-size="24">The router chooses a reasoning workflow, not just a model.</text><path d="M150 520C400 300 520 700 760 475S1060 330 1450 560" fill="none" stroke="url(#g)" stroke-width="30" opacity=".75"/><g filter="url(#s)" font-family="Arial" text-anchor="middle"><g transform="translate(180 480)"><circle r="82" fill="#d9eaf7" stroke="#7aa6c2" stroke-width="5"/><text y="-8" fill="#172554" font-size="30">📥</text><text y="132" fill="#3e342c" font-size="23" font-weight="700">Coding task</text></g><g transform="translate(600 480)"><path d="M0-115l75 45v90L0 115l-75-45v-90z" fill="#e8ddf5" stroke="#a68bc4" stroke-width="6"/><path d="M0-115v230M-75-70L0-25l75-45M-75 20L0 65l75-45" fill="none" stroke="#8a6bc8" stroke-width="4"/><text y="155" fill="#3e342c" font-size="28" font-weight="800">HydraFusion</text><text y="187" fill="#6f7377" font-size="18">workflow router</text></g><g transform="translate(990 310) rotate(-5)"><rect x="-140" y="-55" width="280" height="110" rx="30" fill="#f8dfc4" stroke="#c9986d" stroke-width="5"/><text y="4" fill="#3e342c" font-size="28" font-weight="700">Single</text><text y="36" fill="#6f7377" font-size="18">one model</text></g><g transform="translate(990 500) rotate(4)"><rect x="-140" y="-55" width="280" height="110" rx="30" fill="#fff1bf" stroke="#c8a84e" stroke-width="5"/><text y="4" fill="#3e342c" font-size="28" font-weight="700">Cascade</text><text y="36" fill="#6f7377" font-size="18">escalate</text></g><g transform="translate(990 690) rotate(-4)"><rect x="-165" y="-55" width="330" height="110" rx="30" fill="#f6d6dd" stroke="#c98798" stroke-width="5"/><text y="4" fill="#3e342c" font-size="27" font-weight="700">Draft · critique · revise</text><text y="36" fill="#6f7377" font-size="18">multi-model review</text></g><g transform="translate(1390 500)"><circle r="82" fill="#dcefd6" stroke="#86a878" stroke-width="5"/><text y="-8" font-size="30">✓</text><text y="132" fill="#3e342c" font-size="23" font-weight="700">Verify</text></g></g><path d="M260 480h230M680 430q100-110 170-120M680 480h170M680 530q100 110 170 160M1130 310q130 60 190 130M1130 500h180M1130 690q130-70 190-130" fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round"/><text x="90" y="830" fill="#3e342c" font-family="Arial" font-size="24" font-weight="700">A candidate result becomes engineering work only after independent evidence accepts it.</text></svg>
